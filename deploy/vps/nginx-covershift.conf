# Nginx sites for the CoverShift VPS: API, admin web, landing page.
# Installed by enable_sites.sh. HTTPS is added by certbot once DNS points here
# (certbot edits this file in place, adding the 443 blocks and redirects).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# api.covershift.in -> FastAPI on 127.0.0.1:8000
server {
    listen 80;
    server_name api.covershift.in;

    # Backend accepts 10 MB uploads; leave headroom for the form fields.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # WebSockets (live chat): pass the upgrade through.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

# app.covershift.in -> admin web (React single-page app)
server {
    listen 80;
    server_name app.covershift.in;
    root /var/www/app;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# www.covershift.in -> landing page (React single-page app)
server {
    listen 80;
    server_name www.covershift.in;
    root /var/www/landing;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# Anything else (bare IP, unknown names): refuse.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
